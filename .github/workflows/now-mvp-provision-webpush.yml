name: Provision now-mvp Preview Web Push

on:
  push:
    branches: [now-mvp]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  provision:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.head_commit.message == 'Provision Preview Web Push runtime'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout now-mvp
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: now-mvp

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Vercel token access
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          npx --yes vercel@latest whoami --token "$VERCEL_TOKEN"

      - name: Link Vercel Preview project
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest link --project now-mvp-preview --token "$VERCEL_TOKEN" --yes

      - name: Remove obsolete Vercel Web Push secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for name in VAPID_PRIVATE_KEY NOTIFICATION_WORKER_SECRET; do
            npx --yes vercel@latest env rm "$name" preview --token "$VERCEL_TOKEN" --yes >/dev/null 2>&1 || true
          done

      - name: Verify worker auth gate
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/worker-unauthorized.txt -w '%{http_code}' \
            -X POST 'https://amyysvcpmbyuxelxixqj.supabase.co/functions/v1/notification-worker' \
            -H 'content-type: application/json' \
            --data '{"batchSize":1}')
          echo "unauthorized status=$status"
          test "$status" = '401'

      - name: Read authoritative Supabase VAPID public key
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS \
            'https://amyysvcpmbyuxelxixqj.supabase.co/functions/v1/notification-worker' \
            > /tmp/worker-health.json
          node - <<'NODE'
          const fs = require('fs');
          const body = JSON.parse(fs.readFileSync('/tmp/worker-health.json', 'utf8'));
          if (body.ok !== true || typeof body.vapidPublicKey !== 'string' || body.vapidPublicKey.length < 80) {
            console.error(JSON.stringify(body));
            process.exit(1);
          }
          fs.writeFileSync('/tmp/vapid-public-key', body.vapidPublicKey + '\n');
          NODE
          echo 'Supabase notification-worker configuration is healthy.'

      - name: Update Preview public VAPID key
        shell: bash
        run: |
          set -euo pipefail
          VAPID_PUBLIC_KEY=$(cat /tmp/vapid-public-key)
          python3 - <<'PY'
          from pathlib import Path
          import os
          key = Path('/tmp/vapid-public-key').read_text().strip()
          p = Path('now/web-push-config.js')
          p.write_text("""(() => {\n  // Preview-only public configuration. Never put VAPID private keys here.\n  window.NowWebPushConfig = Object.freeze({\n    vapidPublicKey: '%s',\n  });\n})();\n""" % key)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add now/web-push-config.js
          if git diff --cached --quiet; then
            echo 'Public VAPID key unchanged.'
          else
            git commit -m 'Sync Preview VAPID public key [skip webpush provision]'
            git push origin HEAD:now-mvp
          fi

      - name: Deploy Preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest --token "$VERCEL_TOKEN" --yes

      - name: Verify worker runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl -fsS \
            'https://amyysvcpmbyuxelxixqj.supabase.co/functions/v1/notification-worker')
          echo "$body" | grep -Eq '"ok":true'
          echo 'worker runtime configuration: OK'
