name: now-mvp preview

on:
  push:
    branches:
      - now-mvp
  workflow_dispatch:

concurrency:
  group: now-mvp-preview
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout now-mvp
        uses: actions/checkout@v4

      - name: Skip when Vercel credentials are not configured
        if: ${{ env.VERCEL_TOKEN == '' }}
        run: |
          echo "Vercel preview deploy skipped: VERCEL_TOKEN is not configured."
          echo "No deployment is attempted and the job remains successful."

      - name: Setup Node
        if: ${{ env.VERCEL_TOKEN != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        if: ${{ env.VERCEL_TOKEN != '' }}
        run: npm install --global vercel@latest

      - name: Link only the now-mvp-preview project
        if: ${{ env.VERCEL_TOKEN != '' }}
        working-directory: now
        run: |
          vercel link --yes --project now-mvp-preview --scope gin8 --token "$VERCEL_TOKEN"

      - name: Deploy only the now directory
        if: ${{ env.VERCEL_TOKEN != '' }}
        id: deploy
        working-directory: now
        run: |
          set -euo pipefail
          vercel deploy --yes --token "$VERCEL_TOKEN" 2>&1 | tee deploy.log
          deployment_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.vercel\.app' deploy.log | tail -1)"
          test -n "$deployment_url"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Preview deployment: $deployment_url"

      - name: Verify deployment identity
        if: ${{ env.VERCEL_TOKEN != '' }}
        working-directory: now
        run: |
          set -euo pipefail
          test -n "${{ steps.deploy.outputs.deployment_url }}"
          echo "Verified deployment URL: ${{ steps.deploy.outputs.deployment_url }}"
