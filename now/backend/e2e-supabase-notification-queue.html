<!doctype html>
<meta charset="utf-8">
<title>Supabase notification queue adapter E2E</title>
<pre id="out">running…</pre>
<script type="module">
import { createSupabaseNotificationQueue } from './supabase-notification-queue.ts';

const out = document.querySelector('#out');
const calls = [];
const client = {
  async rpc(name, args) {
    calls.push({ name, args });
    if (name === 'claim_notification_events') {
      return { data: [{ id: 'evt-1', user_id: 'user-1', request_id: 'req-1', kind: 'NEW_NEARBY_REQUEST', attempts: 1 }], error: null };
    }
    if (name === 'mark_notification_delivered') return { data: true, error: null };
    if (name === 'release_notification_event') return { data: true, error: null };
    throw new Error(`unexpected RPC ${name}`);
  },
};

try {
  const queue = createSupabaseNotificationQueue(client);
  const events = await queue.claim(999);
  if (events.length !== 1 || events[0].userId !== 'user-1' || events[0].requestId !== 'req-1' || events[0].attempts !== 1) {
    throw new Error('claim normalization mismatch');
  }
  if (calls[0].args.p_batch_size !== 100) throw new Error('claim batch cap mismatch');

  if (!(await queue.markDelivered('evt-1'))) throw new Error('markDelivered failed');
  if (!(await queue.release('evt-1', 'test error', 9999))) throw new Error('release failed');

  const mark = calls.find(call => call.name === 'mark_notification_delivered');
  const release = calls.find(call => call.name === 'release_notification_event');
  if (mark?.args.p_id !== 'evt-1') throw new Error('mark payload mismatch');
  if (release?.args.p_id !== 'evt-1' || release?.args.p_retry_seconds !== 3600) throw new Error('release clamp mismatch');

  out.textContent = 'PASS: Supabase notification queue adapter preserves worker contract, caps batch size, and clamps retry payload.';
} catch (error) {
  out.textContent = `FAIL: ${error.message}`;
  console.error(error);
}
</script>
