<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Now — real create button E2E</title>
<style>body{margin:0;background:#f5f5f0;color:#151515;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:820px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e7e4de;border-radius:18px;padding:16px;margin:12px 0}.step{padding:9px 11px;border-radius:10px;margin:6px 0;background:#f3f3ef}.ok{background:#e8f7ed;color:#137936}.bad{background:#ffe8e8;color:#a43a3a}button{border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:800;background:#151515;color:#fff;width:100%}</style>
</head>
<body><main>
<h1>Сейчас — real create button E2E</h1>
<div class="card"><button id="run">Запустить E2E</button><div id="steps"></div></div>
<div class="card"><div>Created: <b id="created">0</b></div><div>Realtime starts: <b id="starts">0</b></div><div>Request ID: <b id="request">—</b></div><div>Geo text: <b id="geo">—</b></div><div><b id="result">Ready</b></div></div>
<script>
const $=id=>document.getElementById(id);const add=(t,ok=true)=>{const e=document.createElement('div');e.className='step '+(ok?'ok':'bad');e.textContent=(ok?'✓ ':'✕ ')+t;$('steps').appendChild(e);return ok};
const frame=document.createElement('iframe');frame.src='index-integrated.html';frame.hidden=true;document.body.appendChild(frame);
$('run').onclick=async()=>{
  $('steps').innerHTML='';$('result').textContent='Running';$('created').textContent='0';$('starts').textContent='0';$('request').textContent='—';$('geo').textContent='—';
  await new Promise((resolve,reject)=>{if(frame.contentDocument?.readyState==='complete')return resolve();frame.addEventListener('load',resolve,{once:true});setTimeout(()=>reject(new Error('timeout')),2000)}).catch(()=>{});
  const w=frame.contentWindow;
  if(!add('Public create hook exists',typeof w.NowCreateAndStartRequest==='function'))return;
  if(!add('Button hook installed',w.document.querySelector('#ask')?.dataset.nowCreateRequestHook==='1'))return;

  let creates=0,starts=0,lastRequest=null;
  w.NowCreateRequestAdapter={async createRequest(input){creates+=1;return{request_id:'req-button-e2e-001',request_status:'SEARCHING',expires_at:new Date(Date.now()+60000).toISOString(),queued_count:1,input};}};
  w.NowRealtimeAdapter={async start(id){starts+=1;lastRequest=id;},async stop(){}};
  w.NowRequestRealtimeBridge=w.NowRealtimePageBridge.createOptionalBridge({});

  Object.defineProperty(w.navigator,'geolocation',{configurable:true,value:{getCurrentPosition(success){success({coords:{latitude:55.0301,longitude:82.9201,accuracy:25}});}}});
  const input=w.document.querySelector('#question');
  input.value='Есть очередь?';
  w.document.querySelector('#ask').click();
  await new Promise(r=>setTimeout(r,50));
  $('created').textContent=String(creates);$('starts').textContent=String(starts);$('request').textContent=lastRequest||'—';$('geo').textContent=w.document.querySelector('#geo')?.textContent||'—';
  if(!add('Create adapter called once',creates===1))return;
  if(!add('Realtime started once',starts===1))return;
  if(!add('Created request_id passed to Realtime',lastRequest==='req-button-e2e-001'))return;
  if(!add('Question cleared after successful request',input.value===''))return;
  if(!add('Accuracy gate accepts ±25 m',/точность ±25 м/.test(w.document.querySelector('#geo')?.textContent||'')))return;

  const demoFrame=document.createElement('iframe');demoFrame.src='index-integrated.html';demoFrame.hidden=true;document.body.appendChild(demoFrame);
  await new Promise((resolve,reject)=>{demoFrame.addEventListener('load',resolve,{once:true});setTimeout(()=>reject(new Error('timeout')),2000)}).catch(()=>{});
  const d=demoFrame.contentWindow;
  d.document.querySelector('#question').value='Есть товар?';
  d.document.querySelector('#ask').click();
  await new Promise(r=>setTimeout(r,20));
  if(!add('Demo page keeps original behavior without adapters',d.document.querySelector('#question')?.value===''))return;
  $('result').textContent='✅ Real create button E2E passed';
};
</script></main></body></html>
