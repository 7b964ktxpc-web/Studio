<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сейчас — nearby answer coordinator E2E</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f0;color:#151515;padding:20px}button{padding:10px 14px;border:0;border-radius:10px;background:#151515;color:#fff;font-weight:800}.step{padding:8px 10px;margin:6px 0;border-radius:9px;background:#e8f7ed}.bad{background:#ffe8e8;color:#a43a3a}</style></head>
<body><h1>Сейчас — nearby answer coordinator E2E</h1><button id="run">Запустить E2E</button><div id="steps"></div><script>
const $=id=>document.getElementById(id);const add=(t,ok=true)=>{const e=document.createElement('div');e.className='step'+(ok?'':' bad');e.textContent=(ok?'✓ ':'✕ ')+t;$('steps').appendChild(e);return ok};
async function load(src){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}
$('run').onclick=async()=>{ $('steps').innerHTML=''; await load('main-ui-answer-nearby-coordinator.js'); let subscribed=null; let unsubscribes=0; const source={subscribe:async handlers=>{subscribed=handlers;return()=>{unsubscribes+=1}}}; const binds=[]; const unbinds=[]; const starts=[]; const stops=[]; const controller={async start(id){starts.push(id);return true},async stop(){stops.push(true)}}; const bridge={bind(id){binds.push(id);return true},unbind(){unbinds.push(true)}}; const coordinator=window.NowMainUiAnswerNearbyCoordinator.create({controller,bridge,source});
if(!add('Coordinator enabled',coordinator.enabled===true))return; await coordinator.start(); if(!add('Event source subscribed',typeof subscribed?.onEvent==='function'))return; if(!add('Malformed event ignored',await subscribed.onEvent({kind:'request.created'})===false&&binds.length===0))return; if(!add('Unrelated event ignored',await subscribed.onEvent({kind:'presence.updated',request_id:'req-x'})===false&&binds.length===0))return; if(!add('First nearby request activates',await subscribed.onEvent({kind:'request.created',request_id:'req-a'})===true&&binds.length===1&&starts[0]==='req-a'))return; if(!add('Duplicate nearby request is idempotent',await subscribed.onEvent({kind:'nearby.request',request_id:'req-a'})===true&&binds.length===1&&stops.length===0))return; if(!add('Second nearby request switches lifecycle',await subscribed.onEvent({kind:'request.available',request_id:'req-b'})===true&&stops.length===1&&unbinds.length===1&&binds[1]==='req-b'&&starts[1]==='req-b'))return; if(!add('Active request is req-b',coordinator.getActiveRequestId()==='req-b'))return; await coordinator.stop(); if(!add('Coordinator stop unsubscribes and cleans up',unsubscribes===1&&stops.length===2&&unbinds.length===2&&coordinator.getActiveRequestId()===null))return; add('Nearby answer coordinator E2E passed')};
</script></body></html>
