<!doctype html><meta charset="utf-8"><title>Сейчас — preloaded Realtime dependencies E2E</title><style>body{margin:0;background:#f5f5f0;color:#151515;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:920px;margin:auto;padding:20px}.step{padding:9px 11px;border-radius:10px;margin:6px 0;background:#e8f7ed;color:#137936}.bad{background:#ffe8e8;color:#a43a3a}iframe{width:100%;height:720px;border:1px solid #ddd;border-radius:14px}</style><main><h1>Preloaded dependency regression</h1><div id="steps"></div><iframe id="app" src="index.html"></iframe><script>
const add=(t,ok=true)=>{const e=document.createElement('div');e.className='step'+(ok?'':' bad');e.textContent=(ok?'✓ ':'✕ ')+t;document.getElementById('steps').appendChild(e);return ok};
const frame=document.getElementById('app');
const load=(w,src)=>new Promise((resolve,reject)=>{const s=w.document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;w.document.head.appendChild(s)});
const wait=ms=>new Promise(r=>setTimeout(r,ms));
frame.addEventListener('load',async()=>{
 const w=frame.contentWindow,d=frame.contentDocument;
 if(!add('index.html loaded',!!d?.body))return;
 try{await load(w,'realtime-ui-adapter-contract.js');await load(w,'realtime-ui-lifecycle.js');}catch{add('Dependencies preload',false);return}
 if(!add('Dependencies are preloaded before bridge',!!w.NowRealtimeAdapterContract?.resolveAdapter&&!!w.__NOW_REALTIME_UI__?.createActiveRequestUiLifecycle))return;
 try{await load(w,'main-ui-realtime-bridge.js');}catch{add('Bridge loads after preloaded dependencies',false);return}
 await wait(10);
 if(!add('Bridge resolves preloaded dependencies without waiting for load event',w.NowMainUiRealtimeBridge?.enabled===false||!!w.NowMainUiRealtimeBridge?.createOptionalBridge))return;
 let creates=0,starts=0;
 w.NowRealtimeAdapter={async start(){starts+=1},async stop(){}};
 w.NowCreateRequestAdapter={async createRequest(){creates+=1;return{request_id:'00000000-0000-4000-8000-000000000069',request_status:'SEARCHING'}}};
 const button=d.getElementById('askBtn'),question=d.getElementById('question');
 question.value='Проверка preloaded dependencies';
 Object.defineProperty(w.navigator,'geolocation',{configurable:true,value:{getCurrentPosition(ok){ok({coords:{accuracy:25,latitude:54.98765,longitude:82.8989}})}}});
 button.click();
 await wait(40);
 add('Create request succeeds after preloaded dependencies',creates===1);
 add('Realtime starts with authoritative request_id',starts===1);
}, {once:true});
</script></main>
