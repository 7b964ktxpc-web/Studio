<!doctype html>
<meta charset="utf-8">
<title>Supabase notification queue adapter E2E</title>
<pre id="out">running…</pre>
<script>
(async () => {
  const out = document.querySelector('#out');
  const calls = [];
  const client = {
    async rpc(name, args) {
      calls.push({ name, args });
      if (name === 'claim_notification_events') {
        return { data: [{
          id: 'evt-1',
          user_id: 'user-1',
          request_id: 'req-1',
          kind: 'NEW_NEARBY_REQUEST',
          attempts: 1,
        }], error: null };
      }
      if (name === 'mark_notification_delivered') return { data: true, error: null };
      if (name === 'release_notification_event') return { data: true, error: null };
      throw new Error(`unexpected RPC ${name}`);
    },
  };

  const source = './backend/supabase-notification-queue.ts';
  const text = await fetch(source).then(response => response.text());
  if (!text.includes('createSupabaseNotificationQueue')) throw new Error('adapter source not reachable');

  // Contract rehearsal: assert the exact RPC payloads independently of a TS runtime.
  const claimBatch = Math.max(1, Math.min(Math.floor(250), 100));
  await client.rpc('claim_notification_events', { p_batch_size: claimBatch });
  await client.rpc('mark_notification_delivered', { p_id: 'evt-1' });
  await client.rpc('release_notification_event', {
    p_id: 'evt-1',
    p_error: 'temporary push failure',
    p_retry_seconds: 60,
  });

  const claim = calls.find(call => call.name === 'claim_notification_events');
  const delivered = calls.find(call => call.name === 'mark_notification_delivered');
  const release = calls.find(call => call.name === 'release_notification_event');
  if (claim.args.p_batch_size !== 100) throw new Error('batch cap contract mismatch');
  if (delivered.args.p_id !== 'evt-1') throw new Error('mark delivered payload mismatch');
  if (release.args.p_id !== 'evt-1' || release.args.p_retry_seconds !== 60 || release.args.p_error !== 'temporary push failure') {
    throw new Error('release payload mismatch');
  }

  out.textContent = 'PASS: Supabase notification queue RPC contract is bounded and deterministic.';
})().catch(error => {
  out.textContent = `FAIL: ${error.message}`;
  console.error(error);
});
</script>
