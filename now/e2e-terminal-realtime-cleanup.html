<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Now — terminal Realtime cleanup E2E</title><style>body{margin:0;background:#f5f5f0;color:#151515;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:760px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e7e4de;border-radius:18px;padding:16px}.step{padding:9px 11px;border-radius:10px;margin:6px 0;background:#f3f3ef}.ok{background:#e8f7ed;color:#137936}.bad{background:#ffe8e8;color:#a43a3a}button{border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:800;background:#151515;color:#fff;width:100%}</style></head><body><main><h1>Сейчас — terminal Realtime cleanup E2E</h1><div class="card"><button id="run">Запустить E2E</button><div id="steps"></div></div><script>const $=id=>document.getElementById(id);const add=(t,ok=true)=>{const e=document.createElement('div');e.className='step '+(ok?'ok':'bad');e.textContent=(ok?'✓ ':'✕ ')+t;$('steps').appendChild(e);return ok};const frame=document.createElement('iframe');frame.src='index-integrated.html';frame.hidden=true;document.body.appendChild(frame);$('run').onclick=async()=>{ $('steps').innerHTML='';await new Promise((r,j)=>{if(frame.contentDocument?.readyState==='complete')return r();frame.addEventListener('load',r,{once:true});setTimeout(()=>j(new Error('timeout')),2000)}).catch(()=>{});const w=frame.contentWindow;let snapshots=0,stops=0;w.NowRealtimeAdapter={async start(id,handlers){setTimeout(()=>{snapshots+=1;handlers.onSnapshot({request_id:id,request_status:'ANSWERED'});},0)},async stop(){stops+=1}};const bridge=w.NowRealtimePageBridge.createOptionalBridge({});w.NowRequestRealtimeBridge=bridge;await bridge.start('req-terminal-001');await new Promise(r=>setTimeout(r,25));if(!add('Authoritative terminal snapshot is delivered once',snapshots===1))return;if(!add('UI shows terminal answer state',w.document.querySelector('#geo')?.textContent==='Ответ получен'))return;if(!add('Realtime stop is called after terminal snapshot',stops===1))return;if(!add('No active request remains after terminal cleanup',bridge.getActiveRequestId()===null))return; $('steps').insertAdjacentHTML('beforeend','<div class="step ok">✅ Terminal cleanup E2E passed</div>')};</script></main></body></html>
