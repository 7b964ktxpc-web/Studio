<!doctype html>
<meta charset="utf-8">
<title>Two-user nearby answer runtime E2E</title>
<body><pre id="out">running…</pre>
<script src="main-ui-answer-bridge.js"></script>
<script src="main-ui-answer-realtime-controller.js"></script>
<script src="main-ui-answer-nearby-coordinator.js"></script>
<script>
(async () => {
  const out = document.querySelector('#out');
  document.body.insertAdjacentHTML('beforeend', `
    <section id="incoming">
      <div data-answer-status></div>
      <button data-answer="Да">Да</button>
      <button data-answer="Нет">Нет</button>
    </section>
  `);

  const submitted = [];
  window.NowAnswerRequestAdapter = {
    async submitAnswer(input) {
      submitted.push({ ...input });
      return { request_id: input.request_id, answer_id: 'answer-1', request_status: 'SEARCHING' };
    },
  };

  const sourceHandlers = {};
  const source = {
    async subscribe(handlers) {
      Object.assign(sourceHandlers, handlers);
      return async () => { for (const key of Object.keys(sourceHandlers)) delete sourceHandlers[key]; };
    },
  };

  const realtime = {
    async start(requestId, handlers) {
      this.handlers = handlers;
      this.requestId = requestId;
      queueMicrotask(() => handlers.onSnapshot?.({ request_id: requestId, request_status: 'SEARCHING' }));
    },
    async stop() {},
  };
  window.NowRealtimeAdapter = realtime;
  const contract = window.NowRealtimeAdapterContract || { resolveAdapter: value => ({ adapter: value, errors: [] }) };
  window.NowRealtimeAdapterContract = contract;

  const answerController = window.NowMainUiAnswerRealtimeController.create({ bridge: window.NowMainUiAnswerBridge });
  if (!answerController.enabled) throw new Error('answer controller disabled');

  const coordinator = window.NowMainUiAnswerNearbyCoordinator.create({
    source,
    controller: answerController,
    bridge: window.NowMainUiAnswerBridge,
  });
  if (!coordinator.enabled) throw new Error('coordinator disabled');
  await coordinator.start();

  sourceHandlers.onEvent?.({ kind: 'nearby.request', request_id: 'req-two-user-1', request: { id: 'req-two-user-1', text: 'Есть очередь?', status: 'SEARCHING' } });
  await new Promise(resolve => setTimeout(resolve, 0));
  if (coordinator.getActiveRequestId() !== 'req-two-user-1') throw new Error('coordinator did not activate request');
  if (window.NowMainUiAnswerBridge.getActiveRequestId() !== 'req-two-user-1') throw new Error('answer bridge request_id mismatch');

  document.querySelector('[data-answer="Да"]').click();
  await new Promise(resolve => setTimeout(resolve, 0));
  if (submitted.length !== 1 || submitted[0].request_id !== 'req-two-user-1' || submitted[0].answer !== 'Да') throw new Error('answer submission mismatch');

  out.textContent = 'PASS';
})().catch(error => { document.querySelector('#out').textContent = `FAIL: ${error?.message || error}`; });
</script>
