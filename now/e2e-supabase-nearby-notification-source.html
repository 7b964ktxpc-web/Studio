<!doctype html>
<meta charset="utf-8">
<title>Supabase nearby notification source E2E</title>
<body><pre id="out">running…</pre>
<script src="supabase-nearby-notification-source.js"></script>
<script>
(async () => {
  const out = document.querySelector('#out');
  const channel = [];
  const fakeClient = {
    channel(name) {
      const handlers = {};
      const item = {
        name,
        on(event, config, callback) { handlers.callback = callback; return item; },
        subscribe(callback) { queueMicrotask(() => callback('SUBSCRIBED')); return item; },
        _emit(row) { handlers.callback?.({ new: row }); },
      };
      channel.push(item);
      return item;
    },
    removeChannel: async item => { item.removed = true; },
    auth: { getUser: async () => ({ data: { user: { id: 'user-b' } }, error: null }) },
  };

  const source = window.NowSupabaseNearbyNotificationSource?.createOptionalSource(fakeClient);
  if (!source?.enabled) throw new Error('source disabled');

  let captured = null;
  const stop = await source.subscribe({ onEvent: event => { captured = event; } });
  if (channel.length !== 1) throw new Error('one notification channel expected');

  channel[0]._emit({ id: 'evt-1', user_id: 'user-b', request_id: 'req-123', kind: 'NEW_NEARBY_REQUEST' });
  if (captured?.kind !== 'nearby.request' || captured.request_id !== 'req-123') throw new Error('nearby event normalization failed');

  channel[0]._emit({ id: 'evt-2', user_id: 'user-b', request_id: 'req-456', kind: 'REQUEST_ANSWERED' });
  if (captured.request_id !== 'req-123') throw new Error('non-nearby event should be ignored');

  await stop();
  if (!channel[0].removed) throw new Error('unsubscribe did not remove channel');
  out.textContent = 'PASS';
})().catch(error => { document.querySelector('#out').textContent = `FAIL: ${error?.message || error}`; });
</script>
