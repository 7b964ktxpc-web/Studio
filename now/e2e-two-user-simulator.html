<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сейчас — E2E two-user simulator</title>
<style>
body{margin:0;background:#f5f5f0;color:#151515;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:820px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e7e4de;border-radius:18px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.ok{color:#137936;font-weight:800}.bad{color:#a43a3a;font-weight:800}.warn{color:#896300;font-weight:800}button{border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:800;background:#151515;color:#fff}.preset{background:#efede8;color:#151515;width:100%}.run{width:100%;margin-top:10px}.result{font-size:18px;font-weight:850}.small{font-size:12px;color:#777;margin-top:4px}.steps{display:grid;gap:7px;margin-top:12px}.step{padding:10px 12px;border-radius:12px;background:#f6f6f3}.step.ok{background:#e8f7ed}.step.bad{background:#ffe8e8}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
</style>
</head>
<body><main>
<h1>Сейчас — two-user E2E</h1>
<div class="card"><b>1. Requester</b><div class="row"><span>Request</span><b id="requestId">—</b></div><div class="row"><span>Initial state</span><b id="initial">—</b></div></div>
<div class="card"><b>2. Responder proximity</b><div class="grid" style="margin-top:10px"><button class="preset" data-distance="40">40 м</button><button class="preset" data-distance="80">80 м</button><button class="preset" data-distance="149">149 м</button><button class="preset" data-distance="249">249 м</button><button class="preset" data-distance="251">251 м</button><button class="preset" data-distance="700">700 м</button></div><div class="row"><span>Distance</span><b id="distance">—</b></div><div class="row"><span>Automatic push</span><span id="push">—</span></div></div>
<div class="card"><b>3. Run answer flow</b><button id="run" class="run">Запустить двухпользовательский E2E</button><div class="steps" id="steps"></div></div>
<div class="card"><div class="row"><span>Authoritative snapshot</span><b id="snapshot">—</b></div><div class="row"><span>Realtime refresh calls</span><b id="refreshes">0</b></div><div class="row"><span>Duplicate event refreshes</span><b id="duplicates">0</b></div><div class="result" id="result">Выберите расстояние и запустите сценарий</div></div>
<script>
const state={distance:null};
const els={distance:document.getElementById('distance'),push:document.getElementById('push'),steps:document.getElementById('steps'),snapshot:document.getElementById('snapshot'),refreshes:document.getElementById('refreshes'),duplicates:document.getElementById('duplicates'),result:document.getElementById('result'),requestId:document.getElementById('requestId'),initial:document.getElementById('initial')};
const classify=d=>d<=50?{push:true,stage:'0–50 м'}:d<=100?{push:true,stage:'50–100 м'}:d<=150?{push:true,stage:'100–150 м'}:d<=250?{push:true,stage:'150–250 м'}:{push:false,stage:'>250 м'};
function step(text,ok=true){const el=document.createElement('div');el.className='step '+(ok?'ok':'bad');el.textContent=(ok?'✓ ':'✕ ')+text;els.steps.appendChild(el);return ok;}
function chooseDistance(d){state.distance=d;const x=classify(d);els.distance.textContent=d+' м';els.push.textContent=x.push?'YES · '+x.stage:'NO · '+x.stage;els.push.className=x.push?'ok':'bad';els.result.textContent=x.push?'Готов к E2E: responder eligible.':'E2E остановлен: автоматический push запрещён дальше 250 м.';}
document.querySelectorAll('[data-distance]').forEach(btn=>btn.addEventListener('click',()=>chooseDistance(Number(btn.dataset.distance))));
document.getElementById('run').addEventListener('click',()=>{
  els.steps.innerHTML='';els.snapshot.textContent='—';els.refreshes.textContent='0';els.duplicates.textContent='0';
  if(state.distance===null){els.result.textContent='Сначала выберите расстояние';return;}
  const x=classify(state.distance);const requestId='request-demo-001';els.requestId.textContent=requestId;els.initial.textContent='SEARCHING';
  if(!step('Requester created request → SEARCHING'))return;
  if(!step('Responder proximity checked → '+state.distance+' м · '+x.stage,x.push))return;
  if(!step('Responder submitted one answer'))return;
  const serverSnapshot={id:requestId,status:'ANSWERED'};
  if(!step('Server state changed → ANSWERED'))return;
  if(!step('Realtime answer.created delivered'))return;
  let seen=false;const refresh=()=>{if(seen){els.duplicates.textContent=String(Number(els.duplicates.textContent)+1);return;}seen=true;els.refreshes.textContent=String(Number(els.refreshes.textContent)+1);els.snapshot.textContent=serverSnapshot.status;};
  refresh();if(!step('Requester refreshed authoritative snapshot → ANSWERED'))return;
  refresh();if(!step('Duplicate Realtime event ignored by subscription dedupe'))return;
  els.result.textContent='✅ Two-user E2E passed: request → eligible responder → answer → Realtime → authoritative snapshot.';
});
</script>
</main></body></html>
