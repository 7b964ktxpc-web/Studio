<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Now — request realtime hook E2E</title><style>body{margin:0;background:#f5f5f0;color:#151515;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:820px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e7e4de;border-radius:18px;padding:16px;margin:12px 0}.step{padding:9px 11px;border-radius:10px;margin:6px 0;background:#f3f3ef}.ok{background:#e8f7ed;color:#137936}.bad{background:#ffe8e8;color:#a43a3a}button{border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:800;background:#151515;color:#fff;width:100%}</style></head><body><main>
<h1>Сейчас — active request Realtime hook E2E</h1>
<div class="card"><button id="run">Запустить E2E</button><div id="steps"></div></div>
<div class="card"><div>Bridge enabled: <b id="enabled">—</b></div><div>Active request: <b id="active">—</b></div><div>Snapshots: <b id="snapshots">0</b></div><div>Statuses: <b id="statuses">0</b></div><div>Errors: <b id="errors">0</b></div><div><b id="result">Ready</b></div></div>
<script>
const $=id=>document.getElementById(id);const add=(t,ok=true)=>{const e=document.createElement('div');e.className='step '+(ok?'ok':'bad');e.textContent=(ok?'✓ ':'✕ ')+t;$('steps').appendChild(e);return ok};
const urls=['index-integrated.html'];
const frame=document.createElement('iframe');frame.src=urls[0];frame.hidden=true;document.body.appendChild(frame);
$('run').onclick=async()=>{
 $('steps').innerHTML='';$('result').textContent='Running';$('snapshots').textContent='0';$('statuses').textContent='0';$('errors').textContent='0';$('active').textContent='—';
 await new Promise((resolve,reject)=>{frame.addEventListener('load',resolve,{once:true});setTimeout(()=>reject(new Error('timeout')),2000)}).catch(()=>{});
 const w=frame.contentWindow;if(!w.NowStartRequestRealtime||!w.NowStopRequestRealtime){add('UI request realtime hooks exposed',false);return;}
 let on=0;const adapter={async start(requestId,handlers){on++;window._handlers=handlers;},async stop(){on--;}};
 w.NowRealtimeAdapter=adapter;
 const bridge=w.NowRealtimePageBridge.createOptionalBridge({onSnapshot:()=>{$('snapshots').textContent=String(Number($('snapshots').textContent)+1)},onStatus:()=>{$('statuses').textContent=String(Number($('statuses').textContent)+1)},onError:()=>{$('errors').textContent=String(Number($('errors').textContent)+1)}});
 w.NowRequestRealtimeBridge=bridge;
 $('enabled').textContent=String(bridge.enabled);
 if(!add('Injected adapter enables bridge',bridge.enabled))return;
 await w.NowStartRequestRealtime('request-e2e-001');
 $('active').textContent=bridge.getActiveRequestId();
 if(!add('Real request id becomes active',bridge.getActiveRequestId()==='request-e2e-001'))return;
 window._handlers?.onStatus?.('SUBSCRIBED');window._handlers?.onSnapshot?.({id:'request-e2e-001',status:'SEARCHING'});
 if(!add('Status and authoritative snapshot reach UI',Number($('statuses').textContent)===1&&Number($('snapshots').textContent)===1))return;
 let rejected=false;try{await w.NowStartRequestRealtime('');}catch(e){rejected=true;}
 if(!add('Empty request id is rejected',rejected))return;
 await w.NowStopRequestRealtime();
 if(!add('Stop clears active request',bridge.getActiveRequestId()===null))return;
 $('result').textContent='✅ Request realtime hook E2E passed';
};
</script></main></body></html>
