<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Now — Realtime page bridge E2E</title><style>body{margin:0;background:#f5f5f0;color:#151515;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:820px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e7e4de;border-radius:18px;padding:16px;margin:12px 0}.step{padding:9px 11px;border-radius:10px;margin:6px 0;background:#f3f3ef}.ok{background:#e8f7ed;color:#137936}.bad{background:#ffe8e8;color:#a43a3a}button{border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:800;background:#151515;color:#fff;width:100%}</style></head><body><main><h1>Сейчас — Realtime page bridge E2E</h1><div class="card"><div id="loaded"></div></div><div class="card"><button id="run">Запустить E2E</button><div id="steps"></div></div><div class="card"><div>Bridge enabled: <b id="enabled">—</b></div><div>Active request: <b id="active">—</b></div><div>Snapshots delivered: <b id="snapshots">0</b></div><div>Stale callbacks accepted: <b id="stale">0</b></div><div><b id="result">Ready</b></div></div><script>
const $=id=>document.getElementById(id),urls=['realtime-ui-adapter-contract.js','realtime-ui-lifecycle.js','realtime-ui-page-bridge.js'];
const add=(t,ok=true)=>{const e=document.createElement('div');e.className='step '+(ok?'ok':'bad');e.textContent=(ok?'✓ ':'✕ ')+t;$('steps').appendChild(e);return ok};
const load=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)});
(async()=>{for(const src of urls){try{await load(src);$('loaded').textContent+=($('loaded').textContent?' · ':'')+src}catch(e){$('loaded').textContent='FAILED '+src}}})();
function makeAdapter(){const h=new Map();return{async start(id,handlers){h.set(id,handlers)},async stop(){},emit(id,type,payload){h.get(id)?.[type]?.(payload)}}}
$('run').onclick=async()=>{ $('steps').innerHTML='';$('snapshots').textContent='0';$('stale').textContent='0';$('active').textContent='—';$('result').textContent='Running';await new Promise(r=>setTimeout(r,50));if(!NowRealtimeAdapterContract||!__NOW_REALTIME_UI__||!NowRealtimePageBridge){add('bridge dependencies loaded',false);return}const adapter=makeAdapter();window.NowRealtimeAdapter=adapter;let accepted=0;const bridge=NowRealtimePageBridge.createOptionalBridge({onSnapshot:()=>{accepted+=1;$('snapshots').textContent=String(accepted)}});$('enabled').textContent=String(bridge.enabled);if(!add('Valid adapter enables bridge',bridge.enabled))return;await bridge.start('A');$('active').textContent=bridge.getActiveRequestId();if(!add('Request A active',bridge.getActiveRequestId()==='A'))return;await bridge.start('B');$('active').textContent=bridge.getActiveRequestId();if(!add('Starting B replaces A',bridge.getActiveRequestId()==='B'))return;const before=accepted;adapter.emit('A','onSnapshot',{id:'A',status:'ANSWERED'});await new Promise(r=>setTimeout(r,0));const stale=accepted!==before;$('stale').textContent=stale?'1':'0';if(!add('Late callback from A ignored',!stale))return;await bridge.stop();$('active').textContent=bridge.getActiveRequestId()||'—';if(!add('Stop clears active request',bridge.getActiveRequestId()===null))return;$('result').textContent='✅ Page bridge E2E passed'};
</script></main></body></html>
