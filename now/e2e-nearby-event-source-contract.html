<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сейчас — nearby event source contract E2E</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#f5f5f0;color:#151515}main{max-width:820px;margin:auto;padding:20px}.step{padding:10px 12px;border-radius:10px;margin:7px 0;background:#e8f7ed}.bad{background:#ffe8e8;color:#a43a3a}button{width:100%;padding:12px;border:0;border-radius:12px;background:#151515;color:#fff;font:inherit;font-weight:800}</style></head><body><main><h1>Nearby event source contract E2E</h1><button id="run">Запустить</button><div id="steps"></div><script>const add=(t,ok=true)=>{const d=document.createElement('div');d.className='step'+(ok?'':' bad');d.textContent=(ok?'✓ ':'✕ ')+t;document.getElementById('steps').appendChild(d)};document.getElementById('run').onclick=async()=>{document.getElementById('steps').innerHTML='';const s=document.createElement('script');s.src='nearby-event-source-contract.js';document.head.appendChild(s);await new Promise((r,j)=>{s.onload=r;s.onerror=j});const c=window.NowNearbyEventSourceContract;add('Contract exported',!!c);if(!c)return;const bad=c.resolveSource(null);add('Malformed source rejected',!bad.source&&bad.errors.length===1);const no=c.resolveSource({});add('Missing subscribe rejected',!no.source&&no.errors.length===1);let calls=0;const source={async subscribe({onEvent,onError}){calls+=1;onEvent?.({event_kind:'NEARBY_REQUEST',request_id:'req-75'});return async()=>{calls+=10};},};const valid=c.resolveSource(source);add('Valid source resolved unchanged',valid.source===source&&valid.errors.length===0);const noop=c.createNoopSource();const unsub=await noop.subscribe({});add('Noop source subscribes safely',typeof unsub==='function');add('Nearby event source contract E2E passed')};</script></main></body></html>
