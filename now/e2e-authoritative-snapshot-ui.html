<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Now — authoritative snapshot UI E2E</title><style>body{margin:0;background:#f5f5f0;color:#151515;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:820px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e7e4de;border-radius:18px;padding:16px;margin:12px 0}.step{padding:9px 11px;border-radius:10px;margin:6px 0}.ok{background:#e8f7ed;color:#137936}.bad{background:#ffe8e8;color:#a43a3a}button{border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:800;background:#151515;color:#fff;width:100%}</style></head><body><main><h1>Сейчас — authoritative snapshot UI E2E</h1><div class="card"><button id="run">Запустить E2E</button><div id="steps"></div></div><div class="card"><div>Geo UI: <b id="geo">—</b></div><div>Snapshot status: <b id="snapshot">—</b></div><div><b id="result">Ready</b></div></div><script>
const $=id=>document.getElementById(id);const add=(t,ok=true)=>{const e=document.createElement('div');e.className='step '+(ok?'ok':'bad');e.textContent=(ok?'✓ ':'✕ ')+t;$('steps').appendChild(e);return ok};
const frame=document.createElement('iframe');frame.src='index-integrated.html';frame.hidden=true;document.body.appendChild(frame);
$('run').onclick=async()=>{ $('steps').innerHTML='';$('result').textContent='Running';$('snapshot').textContent='—';await new Promise((resolve,reject)=>{if(frame.contentDocument?.readyState==='complete')return resolve();frame.addEventListener('load',resolve,{once:true});setTimeout(()=>reject(new Error('timeout')),2000)}).catch(()=>{});const w=frame.contentWindow;if(!add('Realtime bridge exists',!!w.NowRealtimePageBridge))return;let handlers=null;w.NowRealtimeAdapter={async start(id,h){handlers=h;},async stop(){}};w.NowRequestRealtimeBridge=w.NowRealtimePageBridge.createOptionalBridge({});if(!add('Bridge enabled with injected adapter',w.NowRequestRealtimeBridge.enabled))return;await w.NowStartRequestRealtime('req-ui-snapshot-001');handlers?.onSnapshot?.({request_status:'ANSWERED',request_id:'req-ui-snapshot-001'});await new Promise(r=>setTimeout(r,0));$('geo').textContent=w.document.querySelector('#geo')?.textContent||'—';$('snapshot').textContent='ANSWERED';if(!add('Authoritative ANSWERED snapshot reaches UI',$('geo').textContent==='Ответ получен'))return;handlers?.onSnapshot?.({request_status:'EXPIRED',request_id:'req-ui-snapshot-001'});await new Promise(r=>setTimeout(r,0));$('geo').textContent=w.document.querySelector('#geo')?.textContent||'—';if(!add('Terminal EXPIRED state reaches UI',$('geo').textContent==='Время ожидания истекло'))return;$('result').textContent='✅ Authoritative snapshot UI E2E passed';};
</script></main></body></html>
