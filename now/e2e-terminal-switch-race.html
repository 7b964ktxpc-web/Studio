<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Now — terminal switch race E2E</title>
<style>body{margin:0;background:#f5f5f0;color:#151515;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:820px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e7e4de;border-radius:18px;padding:16px;margin:12px 0}.step{padding:9px 11px;border-radius:10px;margin:6px 0}.ok{background:#e8f7ed;color:#137936}.bad{background:#ffe8e8;color:#a43a3a}button{border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:800;background:#151515;color:#fff;width:100%}</style>
</head>
<body><main>
<h1>Сейчас — terminal → new request race E2E</h1>
<div class="card"><button id="run">Запустить E2E</button><div id="steps"></div></div>
<div class="card"><div>Starts: <b id="starts">0</b></div><div>Stops: <b id="stops">0</b></div><div>Active: <b id="active">—</b></div><div><b id="result">Ready</b></div></div>
<script>
const $=id=>document.getElementById(id);
const add=(t,ok=true)=>{const e=document.createElement('div');e.className='step '+(ok?'ok':'bad');e.textContent=(ok?'✓ ':'✕ ')+t;$('steps').appendChild(e);return ok};
const frame=document.createElement('iframe');frame.src='index-integrated.html';frame.hidden=true;document.body.appendChild(frame);
$('run').onclick=async()=>{
  $('steps').innerHTML='';$('result').textContent='Running';$('starts').textContent='0';$('stops').textContent='0';$('active').textContent='—';
  await new Promise((resolve,reject)=>{if(frame.contentDocument?.readyState==='complete')return resolve();frame.addEventListener('load',resolve,{once:true});setTimeout(()=>reject(new Error('timeout')),2000)}).catch(()=>{});
  const w=frame.contentWindow;if(!add('Realtime bridge exists',!!w.NowRealtimePageBridge))return;
  let starts=0,stops=0,handlersA=null,bridge;
  w.NowRealtimeAdapter={
    async start(id,handlers){starts+=1;if(id==='req-race-a')handlersA=handlers;},
    async stop(){stops+=1;}
  };
  bridge=w.NowRealtimePageBridge.createOptionalBridge({
    onSnapshot(snapshot){
      if(snapshot?.request_id==='req-race-a' && snapshot?.request_status==='ANSWERED'){
        void bridge.start('req-race-b');
      }
    }
  });
  w.NowRequestRealtimeBridge=bridge;
  await bridge.start('req-race-a');
  handlersA?.onSnapshot?.({request_id:'req-race-a',request_status:'ANSWERED'});
  await new Promise(r=>setTimeout(r,0));
  $('starts').textContent=String(starts);$('stops').textContent=String(stops);$('active').textContent=bridge.getActiveRequestId()||'—';
  if(!add('Terminal request A triggers new request B',starts===2&&bridge.getActiveRequestId()==='req-race-b'))return;
  if(!add('Deferred terminal cleanup does not stop request B',stops===1))return;
  $('result').textContent='✅ Terminal switch race E2E passed';
};
</script></main></body></html>
