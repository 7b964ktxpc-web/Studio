<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#151515"><title>Сейчас — режим рядом</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#151515;background:#f5f5f0}*{box-sizing:border-box}body{margin:0}.wrap{max-width:560px;margin:auto;padding:24px 16px 40px}.card{background:#fff;border:1px solid #e5e2db;border-radius:22px;padding:18px;box-shadow:0 12px 30px rgba(0,0,0,.06)}h1{font-size:32px;letter-spacing:-.05em;margin:0 0 8px}.muted{color:#777;font-size:14px;line-height:1.45}.toggle{width:100%;border:0;border-radius:16px;padding:15px;font:inherit;font-weight:850;cursor:pointer}.on{background:#2cad5a;color:#fff}.off{background:#ece9e2;color:#222}.state{margin-top:14px;padding:14px;border-radius:16px;background:#f6f6f4}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #ece9e2;font-size:14px}.row:last-child{border-bottom:0}.ok{color:#17813d;font-weight:800}.warn{color:#9a6800;font-weight:800}.error{color:#b43f3f;font-weight:800}.small{font-size:12px;color:#777}.log{margin-top:14px;font:12px/1.5 ui-monospace,monospace;white-space:pre-wrap;background:#151515;color:#dceadf;border-radius:14px;padding:12px;min-height:100px;overflow:auto}
</style></head><body><main class="wrap"><section class="card"><h1>Я рядом</h1><p class="muted">Этот режим означает: «я согласен получать короткие вопросы от людей, которые находятся действительно рядом с точкой запроса».</p><button id="toggle" class="toggle off">Не получать запросы рядом</button><div class="state"><div class="row"><span>Статус</span><strong id="status" class="warn">Выключен</strong></div><div class="row"><span>Геолокация</span><span id="geo">не получена</span></div><div class="row"><span>Точность</span><span id="accuracy">—</span></div><div class="row"><span>Последнее обновление</span><span id="updated">—</span></div><div class="row"><span>Следующее обновление</span><span id="next">—</span></div></div><div id="log" class="log">Готово. Геолокация запрашивается только после явного включения режима.</div></section></main><script>
const toggle=document.getElementById('toggle'),statusEl=document.getElementById('status'),geoEl=document.getElementById('geo'),accuracyEl=document.getElementById('accuracy'),updatedEl=document.getElementById('updated'),nextEl=document.getElementById('next'),log=document.getElementById('log');let watchId=null,available=false;
function write(message){log.textContent=`${new Date().toLocaleTimeString('ru-RU')}  ${message}\n`+log.textContent}
function setAvailable(value){available=value;if(value){toggle.textContent='✓ Я рядом — получать запросы';toggle.className='toggle on';statusEl.textContent='Включен';statusEl.className='ok';start();}else{toggle.textContent='Не получать запросы рядом';toggle.className='toggle off';statusEl.textContent='Выключен';statusEl.className='warn';stop();}}
function stop(){if(watchId!==null&&navigator.geolocation){navigator.geolocation.clearWatch(watchId);watchId=null}geoEl.textContent='отключена';accuracyEl.textContent='—';nextEl.textContent='—';write('Режим рядом выключен; геолокация остановлена.')}
function start(){if(!navigator.geolocation){available=false;statusEl.textContent='Недоступна';statusEl.className='error';write('Браузер не поддерживает геолокацию.');return}write('Запрашиваем геолокацию после явного согласия пользователя.');watchId=navigator.geolocation.watchPosition(pos=>{const c=pos.coords;geoEl.textContent=`${c.latitude.toFixed(5)}, ${c.longitude.toFixed(5)}`;accuracyEl.textContent=`${Math.round(c.accuracy)} м`;updatedEl.textContent=new Date().toLocaleTimeString('ru-RU');const next=new Date(Date.now()+60000);nextEl.textContent=next.toLocaleTimeString('ru-RU');if(c.accuracy>50){statusEl.textContent='Включен, но точность недостаточная';statusEl.className='warn';write(`Точность ${Math.round(c.accuracy)} м — не участвует в push-matching.`)}else{statusEl.textContent='Включен';statusEl.className='ok';write(`Presence обновлен. Точность ${Math.round(c.accuracy)} м.`)}},err=>{available=false;statusEl.textContent='Ошибка геолокации';statusEl.className='error';write(`Геолокация: ${err.message}`)}, {enableHighAccuracy:true,maximumAge:30000,timeout:10000})}
toggle.onclick=()=>setAvailable(!available);
</script></body></html>
