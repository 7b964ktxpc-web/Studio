<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сейчас — main UI answer bridge E2E</title><style>body{margin:0;background:#f5f5f0;color:#151515;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:920px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e7e4de;border-radius:18px;padding:16px;margin:12px 0}.step{padding:9px 11px;border-radius:10px;margin:6px 0;background:#f3f3ef}.ok{background:#e8f7ed;color:#137936}.bad{background:#ffe8e8;color:#a43a3a}button{border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:800;background:#151515;color:#fff;width:100%}iframe{width:100%;height:720px;border:1px solid #ddd;border-radius:14px;background:#fff}</style></head>
<body><main><h1>Сейчас — main UI answer bridge E2E</h1><div class="card"><button id="run">Запустить E2E</button><div id="steps"></div></div><div class="card"><div>Bridge: <b id="bridge">—</b></div><div>Submits: <b id="submits">0</b></div><div>Request ID: <b id="request">—</b></div></div><div class="card"><iframe id="app" src="index.html" title="Сейчас — main UI"></iframe></div>
<script>
const $=id=>document.getElementById(id);const add=(t,ok=true)=>{const e=document.createElement('div');e.className='step '+(ok?'ok':'bad');e.textContent=(ok?'✓ ':'✕ ')+t;$('steps').appendChild(e);return ok};const frame=$('app');const settle=ms=>new Promise(r=>setTimeout(r,ms));async function loadScript(w,src){return new Promise((resolve,reject)=>{const s=w.document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;w.document.head.appendChild(s)})}
$('run').onclick=async()=>{$('steps').innerHTML='';const w=frame.contentWindow,d=frame.contentDocument;await settle(20);if(!add('Main index.html loaded',!!d?.body))return;const incoming=d.querySelector('#incomingDemo'),buttons=[...d.querySelectorAll('[data-incoming]')];if(!add('Incoming nearby UI exists',!!incoming&&buttons.length===3))return;const status=d.createElement('div');status.dataset.answerStatus='1';incoming.prepend(status);try{await loadScript(w,'main-ui-answer-bridge.js')}catch{add('Answer bridge script loads',false);return};if(!add('Answer bridge exported',!!w.NowMainUiAnswerBridge?.createOptionalBridge))return;let submits=0,received=null,success=null;w.NowAnswerRequestAdapter={async submitAnswer(input){submits+=1;received=input;await settle(20);return{ok:true,answer_id:'00000000-0000-4000-8000-000000000071',request_id:input.request_id}}};const bridge=w.NowMainUiAnswerBridge.createOptionalBridge({onSuccess:value=>{success=value}});if(!add('Injected answer adapter enables bridge',bridge?.enabled===true))return;const requestId='00000000-0000-4000-8000-000000000071';if(!add('Request binds with authoritative request ID',bridge.bind(requestId)&&bridge.getActiveRequestId()===requestId))return;const first=buttons[0];first.click();first.click();await settle(60);if(!add('Answer submitted exactly once',submits===1))return;if(!add('Authoritative request ID passed unchanged',received?.request_id===requestId))return;if(!add('Answer text passed unchanged',received?.answer==='Нет очереди'))return;if(!add('Answer result reaches UI callback',success?.request_id===requestId&&success?.answer==='Нет очереди'))return;if(!add('Request unbound after successful answer',bridge.getActiveRequestId()===null))return;if(!add('Answer buttons hide after success',buttons.every(b=>b.hidden===true)))return;$('bridge').textContent='enabled';$('submits').textContent=String(submits);$('request').textContent=requestId;
const expired= w.NowMainUiAnswerBridge.createOptionalBridge({});w.NowAnswerRequestAdapter={async submitAnswer(){const e=new Error('expired');e.code='REQUEST_EXPIRED';throw e}};const expiredId='00000000-0000-4000-8000-000000000072';if(!add('Expired-answer scenario binds',expired.bind(expiredId)))return;buttons.forEach(b=>{b.hidden=false;b.disabled=false});if(!add('Foreign snapshot is ignored',expired.applySnapshot({request_id:'00000000-0000-4000-8000-000000000099',status:'EXPIRED'})===false&&expired.getActiveRequestId()===expiredId))return;if(!add('Matching EXPIRED snapshot disables answer',expired.applySnapshot({request_id:expiredId,status:'EXPIRED'})===true&&expired.getActiveRequestId()===expiredId&&buttons.every(b=>b.disabled)))return;buttons[1].click();await settle(30);if(!add('Terminal snapshot blocks submit',submits===1))return;if(!add('Snapshot terminal state is idempotently locked',expired.applySnapshot({request_id:expiredId,status:'EXPIRED'})===true&&buttons.every(b=>b.disabled)))return;if(!add('New request can rebind after terminal state',expired.bind('00000000-0000-4000-8000-000000000073')&&expired.getActiveRequestId()==='00000000-0000-4000-8000-000000000073'&&buttons.every(b=>b.disabled===false)))return;add('Answer bridge E2E passed');};
</script></main></body></html>
