<!doctype html>
<meta charset="utf-8">
<title>Requester answers summary E2E</title>
<body>
  <section class="ask"><textarea id="question"></textarea><button id="ask">Спросить рядом</button><div id="geo"></div></section>
  <div id="out">running…</div>
  <script src="main-ui-request-answers-bridge.js"></script>
  <script>
  (async () => {
    const calls = [];
    const answers = [
      { answer_id: 'a1', answer: 'Нет очереди', created_at: '2026-08-26T00:00:00Z' },
      { answer_id: 'a2', answer: 'Очередь небольшая', created_at: '2026-08-26T00:00:02Z' },
    ];
    window.NowSupabaseRequestAnswersAdapter = {
      createOptionalAdapter() {
        return {
          enabled: true,
          async listAnswers(requestId) {
            calls.push(requestId);
            return answers.slice(0, calls.length);
          },
        };
      },
    };

    if (!window.NowMainUiRequestAnswersBridge.bind('req-summary-1')) throw new Error('bind failed');
    await new Promise(resolve => setTimeout(resolve, 0));
    const card = document.querySelector('#requestAnswersSummary');
    if (!card || card.hidden) throw new Error('summary card not mounted');
    if (!card.querySelector('[data-answer-count]').textContent.includes('1')) throw new Error('first answer count mismatch');

    window.NowMainUiRequestAnswersBridge.applySnapshot({
      request_id: 'req-summary-1',
      request_status: 'SEARCHING',
      event_kind: 'REQUEST_ANSWERED',
    });
    await new Promise(resolve => setTimeout(resolve, 0));
    if (!card.querySelector('[data-answer-count]').textContent.includes('2')) throw new Error('second answer count mismatch');
    if (!card.querySelector('[data-answer-latest]').textContent.includes('Очередь небольшая')) throw new Error('latest answer mismatch');

    window.NowMainUiRequestAnswersBridge.applySnapshot({
      request_id: 'req-summary-1',
      request_status: 'EXPIRED',
    });
    if (!card.querySelector('[data-answer-live]').textContent.includes('Время истекло')) throw new Error('terminal status mismatch');
    if (window.NowMainUiRequestAnswersBridge.getActiveRequestId() !== 'req-summary-1') throw new Error('request id changed unexpectedly');
    document.querySelector('#out').textContent = 'PASS';
  })().catch(error => { document.querySelector('#out').textContent = `FAIL: ${error?.message || error}`; });
  </script>
</body>
