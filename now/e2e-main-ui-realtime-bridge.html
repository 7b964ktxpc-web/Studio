<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Сейчас — main UI Realtime bridge E2E</title><style>body{margin:0;background:#f5f5f0;color:#151515;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:920px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #e7e4de;border-radius:18px;padding:16px;margin:12px 0}.step{padding:9px 11px;border-radius:10px;margin:6px 0;background:#f3f3ef}.ok{background:#e8f7ed;color:#137936}.bad{background:#ffe8e8;color:#a43a3a}button{border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:800;background:#151515;color:#fff;width:100%}iframe{width:100%;height:720px;border:1px solid #ddd;border-radius:14px;background:#fff}</style></head>
<body><main>
<h1>Сейчас — main UI Realtime bridge E2E</h1>
<div class="card"><button id="run">Запустить E2E</button><div id="steps"></div></div>
<div class="card"><div>Bridge: <b id="bridge">—</b></div><div>Creates: <b id="creates">0</b></div><div>Starts: <b id="starts">0</b></div><div>Active request: <b id="active">—</b></div></div>
<div class="card"><iframe id="app" src="index.html" title="Сейчас — main UI"></iframe></div>
<script>
const $=id=>document.getElementById(id);const add=(t,ok=true)=>{const e=document.createElement('div');e.className='step '+(ok?'ok':'bad');e.textContent=(ok?'✓ ':'✕ ')+t;$('steps').appendChild(e);return ok};
const frame=$('app');
async function loadScript(win,src){return new Promise((resolve,reject)=>{const s=win.document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;win.document.head.appendChild(s);});}
async function settle(ms=0){await new Promise(r=>setTimeout(r,ms));}
$('run').onclick=async()=>{
  $('steps').innerHTML='';
  const w=frame.contentWindow,d=frame.contentDocument;
  await new Promise(r=>{if(d?.readyState==='complete'||d?.body)return r();frame.addEventListener('load',r,{once:true});setTimeout(r,2000)});
  if(!add('Main index.html loaded',!!d?.body))return;
  const question=d.querySelector('#question'),button=d.querySelector('#askBtn'),geo=d.querySelector('#geo');
  if(!add('Main question input exists',!!question))return;
  if(!add('Main ask button exists',!!button))return;
  if(!add('Main geo status exists',!!geo))return;
  try{await loadScript(w,'realtime-ui-adapter-contract.js');await loadScript(w,'realtime-ui-lifecycle.js');await loadScript(w,'main-ui-realtime-bridge.js');}catch{add('Realtime bridge scripts load',false);return;}
  if(!add('Main UI bridge is disabled without adapter',w.NowMainUiRealtimeBridge?.enabled===false))return;

  let creates=0,starts=0,stops=0,active=null,received=null;
  w.NowRealtimeAdapter={
    async start(id,handlers){starts+=1;active=id;handlers.onStatus?.('SUBSCRIBED');},
    async stop(){stops+=1;active=null;}
  };
  w.NowCreateRequestAdapter={
    async createRequest(input){
      creates+=1;received=input;
      await settle(20);
      return{request_id:'00000000-0000-4000-8000-000000000063',request_status:'SEARCHING',expires_at:new Date(Date.now()+60000).toISOString(),queued_count:1};
    }
  };
  let bridge=w.NowMainUiRealtimeBridge?.createOptionalBridge?.({});
  w.NowMainUiRealtimeBridge=bridge;
  if(!add('Injected adapters enable main bridge',bridge?.enabled===true))return;

  const originalGeolocation=w.navigator.geolocation;
  Object.defineProperty(w.navigator,'geolocation',{configurable:true,value:{
    getCurrentPosition(success){success({coords:{accuracy:25,latitude:54.98765,longitude:82.89890}})}
  }});
  try{
    question.value='Есть ли сейчас очередь?';
    const labelBefore=button.textContent;
    button.click();
    if(!add('Real button enters busy state',button.disabled===true&&button.getAttribute('aria-busy')==='true'))return;
    await settle(60);
    if(!add('createRequest called exactly once',creates===1))return;
    if(!add('Real geolocation accuracy gate accepted ±25 m',received?.latitude===54.98765&&received?.longitude===82.89890))return;
    if(!add('Authoritative request ID reaches Realtime',starts===1&&active==='00000000-0000-4000-8000-000000000063'))return;
    if(!add('Question clears only after successful handoff',question.value===''))return;
    if(!add('Button restores after handoff',button.disabled===false&&button.getAttribute('aria-busy')===null&&button.textContent===labelBefore))return;
    $('bridge').textContent='enabled';$('creates').textContent=String(creates);$('starts').textContent=String(starts);$('active').textContent=active||'—';
    $('steps').insertAdjacentHTML('beforeend','<div class="step ok">✅ Main UI real create → Realtime E2E passed</div>');
  } finally {
    Object.defineProperty(w.navigator,'geolocation',{configurable:true,value:originalGeolocation});
  }
};
</script></main></body></html>
